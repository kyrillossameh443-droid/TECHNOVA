<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technova-Contact</title>
    <link rel="stylesheet" href="./style.Css">
</head>
<body class="contact-page">

    <div class="contact-card">
        <h1>CONTACT US</h1>
        <form action="">
            <label for="name">Name</label>
            <input id="name" type="text" required name="name" placeholder="enter you name">

            <label for="email">Email</label>
            <input id="email" type="email" required name="email" placeholder="enter your email">

            <label for="mss">Message</label>
            <textarea required name="Message" id="mss"></textarea>

            <input type="submit" value="send">
        </form>
        <div class="CONTACT">
            <p>phone number:+xxxxxxxxxx</p>
            <p>email:xxx@zyyzzy</p>
        </div>
    </div>
</body>
</html>
